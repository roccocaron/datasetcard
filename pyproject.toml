[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roccocaron-datasetcard"
version = "0.1.0"
description = "汇总数据来源、规模、分布与已知偏差，生成说明卡草稿"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "roccocaron" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://roccocaron.github.io"
Repository = "https://github.com/roccocaron/datasetcard"
Issues = "https://github.com/roccocaron/datasetcard/issues"

[project.scripts]
datasetcard = "datasetcard:main"

[tool.setuptools]
py-modules = ["datasetcard"]
